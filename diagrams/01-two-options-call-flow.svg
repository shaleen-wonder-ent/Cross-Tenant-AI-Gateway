<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1160px" height="681px" viewBox="0 0 1160 681" content="&lt;mxfile&gt;&lt;diagram id=&quot;two-options-call-flow&quot; name=&quot;Two Options Call Flow&quot;&gt;&lt;/diagram&gt;&lt;/mxfile&gt;"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="1160" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(580,20.5) scale(1)"><text><tspan>Two Front-Door Options - Same Gateway, Same Back Door</tspan></text></g></g></g></g><g data-cell-id="subtitle"><g><rect x="0" y="26" width="1160" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#666666" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"><g transform="translate(580,40.5) scale(1)"><text><tspan>Only the front-door credential differs between Option 1 and Option 2 - everything from the gateway onward is identical</tspan></text></g></g></g></g><g data-cell-id="colA_hdr"><g transform="translate(0.5,0.5)"><rect x="40" y="60" width="340" height="30" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(210,80) scale(1)"><text><tspan>CUSTOMER TENANT</tspan></text></g></g></g></g><g data-cell-id="colB_hdr"><g transform="translate(0.5,0.5)"><rect x="420" y="60" width="320" height="30" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(580,80) scale(1)"><text><tspan>CROSS-TENANT BOUNDARY - CHOOSE ONE OPTION</tspan></text></g></g></g></g><g data-cell-id="colC_hdr"><g transform="translate(0.5,0.5)"><rect x="780" y="60" width="360" height="30" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(960,80) scale(1)"><text><tspan>PROVIDER TENANT</tspan></text></g></g></g></g><g data-cell-id="user"><g transform="translate(0.5,0.5)"><rect x="40" y="110" width="340" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="24" data-htmlContentWidth="211.09375" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(46,121) scale(1)"><text y="10" data-line-font-size="10" x="0"><tspan>End User</tspan></text><text y="22" data-line-font-size="10" x="0"><tspan>Signs in with the CUSTOMER's own Entra ID</tspan></text></g></g></g></g><g data-cell-id="isv"><g transform="translate(0.5,0.5)"><rect x="40" y="210" width="340" height="90" rx="13.5" ry="13.5" fill="#ffffff" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="36" data-htmlContentWidth="322.265625" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(46,221) scale(1)"><text y="10" data-line-font-size="10" x="0"><tspan>Customer Application (AI Force App)</tspan></text><text y="22" x="0"><tspan>Holds EITHER an OAuth2 client credential OR an APIM subscription</tspan></text><text y="34" x="0"><tspan>key - never a raw Foundry/Anthropic key</tspan></text></g></g></g></g><g data-cell-id="option1"><g><rect x="420" y="150" width="320" height="100" rx="15" ry="15" fill="#dae8fc" stroke="#1a73e8" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(26, 115, 232), rgb(79, 156, 255));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="60" data-htmlContentWidth="304.4677734375" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(426,161) scale(1)"><text y="10" data-line-font-size="10" x="0"><tspan>OPTION 1: OAuth2 client-credentials</tspan></text><text y="22" data-line-font-size="10" x="0"/><text y="34" x="0"><tspan>Customer Application gets a Bearer JWT from the CUSTOMER's</tspan></text><text y="46" x="0"><tspan>Entra ID (client_credentials grant), presents it to APIM.</tspan></text><text y="58" x="0"><tspan>validate-jwt checks issuer/audience/claims.</tspan></text></g></g></g></g><g data-cell-id="option2"><g><rect x="420" y="270" width="320" height="100" rx="15" ry="15" fill="#e0f7fa" stroke="#00838f" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(224, 247, 250), rgb(13, 33, 36)); stroke: light-dark(rgb(0, 131, 143), rgb(58, 171, 181));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="60" data-htmlContentWidth="286.69921875" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(426,281) scale(1)"><text y="10" data-line-font-size="10" x="0"><tspan>OPTION 2: APIM Subscription Key</tspan></text><text y="22" data-line-font-size="10" x="0"/><text y="34" x="0"><tspan>Customer Application sends an Ocp-Apim-Subscription-Key</tspan></text><text y="46" x="0"><tspan>header. APIM validates the key against the client's</tspan></text><text y="58" x="0"><tspan>product/subscription.</tspan></text></g></g></g></g><g data-cell-id="apim"><g transform="translate(0.5,0.5)"><rect x="780" y="180" width="360" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="48" data-htmlContentWidth="316.7431640625" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(786,191) scale(1)"><text y="10" data-line-font-size="10" x="0"><tspan>Azure API Management (v2 tier)</tspan></text><text y="22" data-line-font-size="10" x="0"/><text y="34" x="0"><tspan>Either option authenticates the caller and resolves it to a per-client</tspan></text><text y="46" x="0"><tspan>product for quota + metering</tspan></text></g></g></g></g><g data-cell-id="mi"><g transform="translate(0.5,0.5)"><rect x="780" y="310" width="360" height="90" rx="13.5" ry="13.5" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" data-blockTextHeight="24" data-htmlContentWidth="342.7978515625" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(786,321) scale(1)"><text y="10" x="0"><tspan>Managed identity to Foundry (SAME-TENANT hop) - identical regardless</tspan></text><text y="22" x="0"><tspan>of Option 1 or Option 2</tspan></text></g></g></g></g><g data-cell-id="foundry"><g transform="translate(0.5,0.5)"><rect x="780" y="420" width="360" height="70" rx="10.5" ry="10.5" fill="#ffffff" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(786,440) scale(1)"><text><tspan>Microsoft Foundry - Claude deployment</tspan></text></g></g></g></g><g data-cell-id="anthropic"><g transform="translate(0.5,0.5)"><rect x="780" y="510" width="360" height="60" rx="9" ry="9" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(786,530) scale(1)"><text><tspan>Anthropic-operated inference</tspan></text></g></g></g></g><g data-cell-id="e_user_isv"><g transform="translate(0.5,0.5)"><path d="M 210 180 L 210 201.88" fill="none" stroke="#6c8ebf" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/><path d="M 210 208.88 L 206.5 201.88 L 213.5 201.88 Z" fill="#6c8ebf" stroke="#6c8ebf" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(108, 142, 191), rgb(92, 121, 163)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g></g><g data-cell-id="e_isv_opt1"><g><path d="M 380 237 L 400 237 L 400 200 L 409.76 200" fill="none" stroke="#1a73e8" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(26, 115, 232), rgb(79, 156, 255));"/><path d="M 417.76 200 L 409.76 204 L 409.76 196 Z" fill="#1a73e8" stroke="#1a73e8" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 115, 232), rgb(79, 156, 255)); stroke: light-dark(rgb(26, 115, 232), rgb(79, 156, 255));"/></g><g><g fill="#ffffff" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><g transform="translate(400,223.5) scale(1)"><text><tspan>1a</tspan></text></g></g></g></g><g data-cell-id="e_isv_opt2"><g><path d="M 380 282 L 400 282 L 400 320 L 409.76 320" fill="none" stroke="#00838f" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(0, 131, 143), rgb(58, 171, 181));"/><path d="M 417.76 320 L 409.76 324 L 409.76 316 Z" fill="#00838f" stroke="#00838f" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(0, 131, 143), rgb(58, 171, 181)); stroke: light-dark(rgb(0, 131, 143), rgb(58, 171, 181));"/></g><g><g fill="#ffffff" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"><g transform="translate(400,306.5) scale(1)"><text><tspan>1b</tspan></text></g></g></g></g><g data-cell-id="e_opt1_apim"><g><path d="M 740 180 L 760 180 L 760 213 L 769.76 213" fill="none" stroke="#1a73e8" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(26, 115, 232), rgb(79, 156, 255));"/><path d="M 777.76 213 L 769.76 217 L 769.76 209 Z" fill="#1a73e8" stroke="#1a73e8" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(26, 115, 232), rgb(79, 156, 255)); stroke: light-dark(rgb(26, 115, 232), rgb(79, 156, 255));"/></g></g><g data-cell-id="e_opt2_apim"><g><path d="M 740 340 L 760 340 L 760 257 L 769.76 257" fill="none" stroke="#00838f" stroke-width="2" stroke-miterlimit="10" stroke-dasharray="6 6" pointer-events="stroke" style="stroke: light-dark(rgb(0, 131, 143), rgb(58, 171, 181));"/><path d="M 777.76 257 L 769.76 261 L 769.76 253 Z" fill="#00838f" stroke="#00838f" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(0, 131, 143), rgb(58, 171, 181)); stroke: light-dark(rgb(0, 131, 143), rgb(58, 171, 181));"/></g></g><g data-cell-id="e_apim_mi"><g transform="translate(0.5,0.5)"><path d="M 960 290 L 960 301.88" fill="none" stroke="#82b366" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/><path d="M 960 308.88 L 956.5 301.88 L 963.5 301.88 Z" fill="#82b366" stroke="#82b366" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(130, 179, 102), rgb(68, 110, 44)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g></g><g data-cell-id="e_mi_foundry"><g transform="translate(0.5,0.5)"><path d="M 960 400 L 960 411.88" fill="none" stroke="#82b366" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/><path d="M 960 418.88 L 956.5 411.88 L 963.5 411.88 Z" fill="#82b366" stroke="#82b366" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(130, 179, 102), rgb(68, 110, 44)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g></g><g data-cell-id="e_foundry_anthropic"><g transform="translate(0.5,0.5)"><path d="M 960 490 L 960 501.88" fill="none" stroke="#d79b00" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/><path d="M 960 508.88 L 956.5 501.88 L 963.5 501.88 Z" fill="#d79b00" stroke="#d79b00" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(215, 155, 0), rgb(153, 101, 0)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g></g><g data-cell-id="footer"><g transform="translate(0.5,0.5)"><rect x="40" y="600" width="1100" height="80" rx="12" ry="12" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#000000" font-family="Helvetica" font-style="italic" text-anchor="middle" data-blockTextHeight="24" data-htmlContentWidth="1076.5185546875" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><g transform="translate(590,628) scale(1)"><text y="10" x="0"><tspan>Both options terminate identity at the gateway. Only the front-door credential (Option 1 vs Option 2, shown above) differs - everything from APIM onward (managed identity to Foundry, Foundry's internal call to Anthropic) is identical regardless of</tspan></text><text y="22" x="0"><tspan>choice. A client can start on Option 2 for a fast pilot and move to Option 1 later without changing anything past the front door.</tspan></text></g></g></g></g></g></g></g></svg>